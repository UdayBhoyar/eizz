  <path d="M 38 36 L 88 36 C 92 36 94 38 94 42 C 94 46 92 48 88 48 L 52 48 L 52 58 L 80 58 C 84 58 86 60 86 64 C 86 68 84 70 80 70 L 52 70 L 52 80 L 88 80 C 92 80 94 82 94 86 C 94 90 92 92 88 92 L 38 92 C 34 92 32 90 32 86 L 32 42 C 32 38 34 36 38 36 Z" fill="#ffffff"/>

